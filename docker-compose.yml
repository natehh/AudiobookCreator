version: '3.8'
services:
  audiobook-creator:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
      - ./tmp:/app/tmp
      - ./data:/app/data 
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONASYNCIODEBUG=1
      - ESPEAK_DATA_PATH=/usr/share/espeak-data
      - AUDIODEV=null
      - SQLALCHEMY_DATABASE_URL=sqlite:////app/data/audiobookcreator.db
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"