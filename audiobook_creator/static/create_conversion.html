<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiobook Creator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            margin-top: 2rem;
        }

        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 4px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 1rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
        }

        .upload-area.dragover {
            border-color: #ff6b6b;
            background-color: rgba(255, 107, 107, 0.1);
        }

        .status {
            margin-top: 1rem;
            text-align: center;
        }

        button {
            background-color: #ff6b6b;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #ff5252;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-button {
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .nav-button.active {
            background: #ff6b6b;
        }

        .nav-button.active:hover {
            background: #ff5252;
        }

        .error {
            color: #ff6b6b;
            margin-top: 1rem;
        }

        .download-btn {
            background-color: #2196F3;
            margin-right: 1rem;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">Audiobook Creator</a>
        <div class="nav-buttons">
            <a href="/static/create_conversion.html" class="nav-button active">Create audiobook</a>
            <a href="/static/account.html" class="nav-button">Account</a>
            <a href="#" class="nav-button" onclick="logout()">Logout</a>
        </div>
    </nav>
    <div class="container">
        <h1>Audiobook Creator</h1>
        <div class="upload-area" id="dropZone">
            <p>Drag and drop your ebook file here or click to select</p>
            <p>Supported formats: .epub, .mobi, .txt</p>
            <input type="file" id="fileInput" accept=".epub,.mobi,.txt" style="display: none">
        </div>
        <div class="error" id="error"></div>
    </div>

    <script>
        const API_URL = '';
        let currentConversionId = null;
        let statusCheckInterval = null;
        let ws = null;

        // Setup drag and drop
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const statusText = document.getElementById('status');
        const errorText = document.getElementById('error');
        const downloadBtn = document.getElementById('downloadBtn');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            handleFile(file);
        });
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            handleFile(file);
        });

        async function handleFile(file) {
            if (!file) return;

            const validExtensions = ['.epub', '.mobi', '.txt'];
            const fileExtension = file.name.toLowerCase().substring(file.name.lastIndexOf('.'));
            
            if (!validExtensions.includes(fileExtension)) {
                errorText.textContent = 'Unsupported file format. Please use .epub, .mobi, or .txt files.';
                return;
            }

            errorText.textContent = '';
            
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_URL}/convert/`, {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('Response error:', {
                        status: response.status,
                        statusText: response.statusText,
                        error: errorData
                    });
                    throw new Error(`Conversion failed: ${errorData.detail || response.statusText}`);
                }

                const data = await response.json();
                currentConversionId = data.id;
                window.location.href = `/conversion/${currentConversionId}`;
                
            } catch (error) {
                console.error('Request error:', error);
                errorText.textContent = `Error: ${error.message}`;
            }
        }

        async function logout() {
            try {
                await fetch('/auth/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
                window.location.href = '/static/index.html';
            } catch (error) {
                console.error('Error logging out:', error);
            }
        }
    </script>
</body>
</html>
