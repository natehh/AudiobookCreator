<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiobook Creator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            margin-top: 2rem;
            padding-top: 80px;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 4px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 1rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
        }

        .upload-area.dragover {
            border-color: #ff6b6b;
            background-color: rgba(255, 107, 107, 0.1);
        }

        .status {
            margin-top: 1rem;
            text-align: center;
        }

        button {
            background-color: #ff6b6b;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #ff5252;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-button {
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .nav-button.active {
            background: #ff6b6b;
        }

        .nav-button.active:hover {
            background: #ff5252;
        }

        .error {
            color: #ff6b6b;
            margin-top: 1rem;
        }

        .download-btn {
            background-color: #2196F3;
            margin-right: 1rem;
        }

        .voice-selection {
            background: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .voice-dropdown {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 4px;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .pricing-info {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 4px;
            margin: 1rem 0;
        }

        .total-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff6b6b;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .primary-button, .secondary-button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 1rem;
        }

        .primary-button {
            background: #ff6b6b;
            color: white;
        }

        .secondary-button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">Audiobook Creator</a>
        <div class="nav-buttons">
        </div>
    </nav>
    <div class="container">
        <h1>Audiobook Creator</h1>
        <div class="upload-area" id="dropZone">
            <p>Drag and drop your ebook file here or click to select</p>
            <p>Supported formats: .epub, .mobi, .txt</p>
            <input type="file" id="fileInput" accept=".epub,.mobi,.txt" style="display: none">
        </div>

        <div id="voiceSelection" class="voice-selection">
            <h2>Select Voice</h2>
            <select id="voiceSelect" class="voice-dropdown">
                <option value="">Choose a voice...</option>
            </select>
            
            <div id="pricingInfo" style="display: none;" class="pricing-info">
                <p>Estimated characters: <span id="charCount">0</span></p>
                <p>Price per character: $<span id="pricePerChar">0.000000</span></p>
                <p class="total-price">Total price: $<span id="totalPrice">0.00</span></p>
            </div>

            <div class="action-buttons">
                <button id="startConversion" class="primary-button" disabled>Start Conversion</button>
                <button id="cancelSelection" class="secondary-button">Cancel</button>
            </div>
        </div>
        
        <div class="error" id="error"></div>
    </div>

    <script>
        const API_URL = '';
        let currentConversionId = null;
        let statusCheckInterval = null;
        let ws = null;
        let currentFile = null;

        // Setup drag and drop
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const statusText = document.getElementById('status');
        const errorText = document.getElementById('error');
        const downloadBtn = document.getElementById('downloadBtn');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            handleFile(file);
        });
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            handleFile(file);
        });

        // Add these right after your existing variable declarations
        document.addEventListener('DOMContentLoaded', loadVoices);

        async function loadVoices() {
            try {
                const response = await fetch('/api/pricing/voices');
                const voiceTiers = await response.json();
                const select = document.getElementById('voiceSelect');
                
                voiceTiers.forEach(tier => {
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = `${tier.tier_name} - $${tier.price_per_char.toFixed(6)}/char`;
                    
                    tier.voices.forEach(voice => {
                        const option = document.createElement('option');
                        option.value = JSON.stringify({
                            name: voice.name,
                            price_per_char: Number(tier.price_per_char)
                        });
                        option.textContent = `${voice.name} (${voice.country})`;
                        optgroup.appendChild(option);
                    });
                    
                    select.appendChild(optgroup);
                });

                // Add change handler
                select.addEventListener('change', updatePricing);
            } catch (error) {
                console.error('Error loading voices:', error);
                errorText.textContent = 'Error loading available voices';
            }
        }

        function updateStartButton() {
            const select = document.getElementById('voiceSelect');
            const startButton = document.getElementById('startConversion');
            startButton.disabled = !select.value || !currentFile;
        }

        async function handleFile(file) {
            if (!file) return;

            const validExtensions = ['.epub', '.mobi', '.txt'];
            const fileExtension = file.name.toLowerCase().substring(file.name.lastIndexOf('.'));
            
            if (!validExtensions.includes(fileExtension)) {
                errorText.textContent = 'Unsupported file format. Please use .epub, .mobi, or .txt files.';
                return;
            }

            currentFile = file;
            errorText.textContent = '';
            
            // Calculate initial pricing if voice is already selected
            updatePricing();
            updateStartButton();
        }

        async function updatePricing() {
            const select = document.getElementById('voiceSelect');
            const pricingInfo = document.getElementById('pricingInfo');
            const errorText = document.getElementById('error');
            
            if (!select.value || !currentFile) {
                pricingInfo.style.display = 'none';
                return;
            }

            const formData = new FormData();
            formData.append('file', currentFile);
            // Use URLSearchParams to properly encode the voice_id
            formData.append('voice_id', encodeURIComponent(select.value));

            try {
                const response = await fetch('/api/pricing/calculate', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to calculate price');
                }

                const data = await response.json();
                
                document.getElementById('charCount').textContent = data.char_count.toLocaleString();
                document.getElementById('pricePerChar').textContent = data.price_per_char.toFixed(6);
                document.getElementById('totalPrice').textContent = data.total_price.toFixed(2);
                pricingInfo.style.display = 'block';
            } catch (error) {
                errorText.textContent = `Error calculating price: ${error.message}`;
            }
        }

        // Add this to your DOMContentLoaded event or after your variable declarations
        document.getElementById('voiceSelect').addEventListener('change', () => {
            updatePricing();
            updateStartButton();
        });

        // Add event listeners for the action buttons
        document.getElementById('startConversion').addEventListener('click', async () => {
            const select = document.getElementById('voiceSelect');
            if (!select.value) {
                errorText.textContent = 'Please select a voice first';
                return;
            }

            const formData = new FormData();
            formData.append('file', currentFile);
            formData.append('voice', select.value);
            
            try {
                const response = await fetch(`${API_URL}/convert/`, {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Conversion failed');
                }

                const data = await response.json();
                window.location.href = `/static/conversion.html?id=${data.id}`;
            } catch (error) {
                errorText.textContent = `Error: ${error.message}`;
            }
        });

        document.getElementById('cancelSelection').addEventListener('click', () => {
            // Clear voice selection
            document.getElementById('voiceSelect').value = '';
            // Hide pricing info
            document.getElementById('pricingInfo').style.display = 'none';
            // Clear any error messages
            document.getElementById('error').textContent = '';
            // Update start button state
            updateStartButton();
        });

        async function logout() {
            try {
                await fetch('/auth/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
                window.location.reload();
            } catch (error) {
                console.error('Error logging out:', error);
                window.location.reload();
            }
        }

        async function updateNavigation() {
            try {
                const response = await fetch('/api/account', {
                    credentials: 'include'
                });
                
                const isAuthenticated = response.ok;
                const navButtons = document.querySelector('.nav-buttons');
                
                if (isAuthenticated) {
                    navButtons.innerHTML = `
                        <a href="/static/create_conversion.html" class="nav-button">Create audiobook</a>
                        <a href="/static/pricing.html" class="nav-button">Pricing</a>
                        <a href="/static/account.html" class="nav-button">Account</a>
                        <a href="#" class="nav-button" onclick="logout()">Logout</a>
                    `;
                } else {
                    window.location.href = '/static/index.html';
                }
                
                // Set active class for current page
                const currentPath = window.location.pathname;
                const currentButton = navButtons.querySelector(`[href="${currentPath}"]`);
                if (currentButton) {
                    currentButton.classList.add('active');
                }
            } catch (error) {
                console.error('Error checking authentication:', error);
                window.location.href = '/static/index.html';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateNavigation();
            setupDragAndDrop();
        });
    </script>
</body>
</html>
