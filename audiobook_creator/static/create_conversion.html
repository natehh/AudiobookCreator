<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiobook Creator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            margin-top: 2rem;
            padding-top: 80px;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }

        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 4px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 1rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
        }

        .upload-area.dragover {
            border-color: #ff6b6b;
            background-color: rgba(255, 107, 107, 0.1);
        }

        .status {
            margin-top: 1rem;
            text-align: center;
        }

        button {
            background-color: #ff6b6b;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #ff5252;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-button {
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .nav-button.active {
            background: #ff6b6b;
        }

        .nav-button.active:hover {
            background: #ff5252;
        }

        .error {
            color: #ff6b6b;
            margin-top: 1rem;
        }

        .download-btn {
            background-color: #2196F3;
            margin-right: 1rem;
        }

        .voice-selection {
            background: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .voice-dropdown {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 4px;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .pricing-info {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 4px;
            margin: 1rem 0;
        }

        .total-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff6b6b;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .primary-button, .secondary-button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 1rem;
        }

        .primary-button {
            background: #ff6b6b;
            color: white;
        }

        .secondary-button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* Demo player styles */
        .demo-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            margin: 2rem 0;
        }

        .demo-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            color: #eee;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .demo-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .demo-voice-select {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
        }

        .demo-button {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 24px;
            background: #ff6b6b;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .demo-button:hover {
            background: #ff5252;
        }

        .demo-button:disabled {
            background: #666;
            cursor: not-allowed;
        }
    </style>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="/static/js/demo-player.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/create-conversion.js"></script>
</head>
<body>
    <nav>
        <a href="/" class="logo">Audiobook Creator</a>
        <div class="nav-buttons">
        </div>
    </nav>
    <div class="container">
        <h1>Audiobook Creator</h1>
        <div class="upload-area" id="dropZone">
            <p>Drag and drop your ebook file here or click to select</p>
            <p>Supported formats: .epub, .mobi, .txt</p>
            <input type="file" id="fileInput" accept=".epub,.mobi,.txt" style="display: none">
        </div>

        <div id="voiceSelection" class="voice-selection">
            <h2>Select Voice</h2>
            <select id="voiceSelect" class="voice-dropdown">
                <option value="">Choose a voice...</option>
            </select>
            
            <div id="pricingInfo" style="display: none;" class="pricing-info">
                <p>Estimated characters: <span id="charCount">0</span></p>
                <p>Price per character: $<span id="pricePerChar">0.000000</span></p>
                <p class="total-price">Total price: $<span id="totalPrice">0.00</span></p>
            </div>

            <div class="action-buttons">
                <button id="startConversion" class="primary-button" disabled>Create Audiobook</button>
                <button id="cancelSelection" class="secondary-button">Cancel</button>
            </div>
        </div>
        
        <div id="demoPlayer"></div>
        
        <div class="error" id="error"></div>
    </div>
</body>
</html>
