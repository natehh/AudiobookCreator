<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiobook Creator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 80px;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-button {
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .nav-button.active {
            background: #ff6b6b;
        }

        .nav-button.active:hover {
            background: #ff5252;
        }

        .primary-button {
            background-color: #ff6b6b;
            border-radius: 24px;
        }

        .hero {
            text-align: center;
            padding: 4rem 1rem;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
        }

        .hero p {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            color: #ccc;
        }

        .features {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: 3rem;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        .signup-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            max-width: 400px;
            margin: 2rem auto;
            position: relative;
        }

        .signup-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border: none;
            border-radius: 8px;
            background: white;
            box-sizing: border-box;
        }

        .signup-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #ff6b6b;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: background-color 0.2s;
        }

        .signup-button:hover {
            background: #ff5252;
        }

        .google-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #333;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .google-button:hover {
            background-color: #f5f5f5;
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem;
            border-radius: 8px;
            color: white;
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
            display: none;
        }

        .message.success {
            background-color: #4CAF50;
        }

        .message.error {
            background-color: #f44336;
        }

        .signup-box.highlight {
            box-shadow: 0 0 0 2px #ff6b6b;
            animation: pulse 1.5s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .demo-section {
            margin: 3rem auto;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        .demo-section h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .demo-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            color: #eee;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .demo-controls {
            text-align: center;
        }

        .voice-select {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1rem;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
        }

        .demo-button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 24px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .demo-button:hover {
            background: #ff5252;
        }

        .demo-button:disabled {
            background: #666;
            cursor: not-allowed;
        }
    </style>
    <script src="/static/demo-player.js"></script>
</head>
<body>
    <nav>
        <a href="/" class="logo">Audiobook Creator</a>
        <div class="nav-buttons">
        </div>
    </nav>
    
    <div class="container">
        <div class="hero">
            <h1>Transform Your Books Into Audio</h1>
            <p>Create professional audiobooks instantly with AI-powered voice technology</p>
            
            <div class="signup-box">
                <input type="email" id="emailInput" placeholder="Enter your email..." class="signup-input">
                <button onclick="requestMagicLink()" class="signup-button">Create Your Audiobook →</button>
                <div style="text-align: center; margin: 1rem 0; color: #999;">or</div>
                <a href="/auth/login/google" class="google-button">
                    <svg width="18" height="18" viewBox="0 0 18 18">
                        <path fill="#4285f4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"></path>
                        <path fill="#34a853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"></path>
                        <path fill="#fbbc05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"></path>
                        <path fill="#ea4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"></path>
                    </svg>
                    Continue with Google
                </a>
            </div>

            <div id="demoPlayer"></div>

            <div class="features">
                <div class="feature">
                    🎧 Convert any ebook into a professional audiobook in minutes
                </div>
                <div class="feature">
                    🎭 Choose from dozens of natural-sounding voices
                </div>
                <div class="feature">
                    📱 Listen on any device, anywhere
                </div>
            </div>
        </div>
    </div>

    <div id="message" class="message"></div>

    <script>
        async function requestMagicLink() {
            const email = document.getElementById('emailInput').value;
            const messageDiv = document.getElementById('message');
            
            if (!email || !email.includes('@')) {
                showMessage('Please enter a valid email address', 'error');
                return;
            }
            
            try {
                const response = await fetch('/auth/request-magic-link', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email }),
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('Signup link sent! Please check your email.', 'success');
                } else {
                    showMessage(data.detail || 'Failed to send signup link', 'error');
                }
            } catch (error) {
                showMessage('An error occurred', 'error');
            }
        }
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        function highlightSignup(event) {
            event.preventDefault();
            const signupBox = document.querySelector('.signup-box');
            const emailInput = document.getElementById('emailInput');
            
            signupBox.classList.add('highlight');
            emailInput.focus();
            
            // Remove highlight after animation
            setTimeout(() => {
                signupBox.classList.remove('highlight');
            }, 1500);
            
            // Scroll signup box into view if needed
            signupBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        async function updateNavigation() {
            try {
                const response = await fetch('/api/account', {
                    credentials: 'include'
                });
                
                const isAuthenticated = response.ok;
                const navButtons = document.querySelector('.nav-buttons');
                
                if (isAuthenticated) {
                    navButtons.innerHTML = `
                        <a href="/static/create_conversion.html" class="nav-button">Create audiobook</a>
                        <a href="/static/pricing.html" class="nav-button">Pricing</a>
                    `;
                    // Only redirect if we're on the exact root path
                    if (window.location.pathname === '/') {
                        window.location.href = '/static/account.html';
                    }
                } else {
                    navButtons.innerHTML = `
                        <a href="/static/pricing.html" class="nav-button">Pricing</a>
                        <a href="#" class="nav-button" onclick="highlightSignup(event)">Log in</a>
                        <a href="#" class="nav-button primary-button" onclick="highlightSignup(event)">Get Started</a>
                    `;
                }
                
                // Set active class for current page
                const currentPath = window.location.pathname;
                const currentButton = navButtons.querySelector(`[href="${currentPath}"]`);
                if (currentButton) {
                    currentButton.classList.add('active');
                }
            } catch (error) {
                console.error('Error checking authentication:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateNavigation();
            setupDemoPlayer('demoPlayer');
        });
    </script>
</body>
</html>
