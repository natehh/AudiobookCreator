<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion Details - Audiobook Creator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            padding-top: 80px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-button {
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .conversion-details {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
        }

        .detail-row {
            display: flex;
            margin-bottom: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .detail-label {
            flex: 0 0 150px;
            font-weight: bold;
            color: #ccc;
        }

        .detail-value {
            flex: 1;
        }

        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 24px;
            font-weight: 500;
            text-transform: capitalize;
        }

        .status-completed {
            background: #28a745;
        }

        .status-processing {
            background: #ffc107;
            color: #000;
        }

        .status-failed {
            background: #dc3545;
        }

        .button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 24px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            display: inline-block;
            margin-top: 1rem;
        }

        .button:hover {
            background: #ff5252;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: #ff6b6b;
            transition: width 0.3s ease;
        }

        .expiration-time {
            color: #999;
            font-size: 0.9rem;
            margin-top: 0.25rem;
            font-style: italic;
        }

        .expired {
            color: #ff0000;
        }

        .expired .expiration-time {
            color: #ff0000;
            font-weight: bold;
        }
    </style>
    <script src="/static/js/common.js"></script>
</head>
<body>
    <nav>
        <a href="/" class="logo">Audiobook Creator</a>
        <div class="nav-buttons">
            <a href="/static/account.html" class="nav-button">Account</a>
        </div>
    </nav>

    <div class="container">
        <div class="conversion-details">
            <h2 class="section-title">Conversion Details</h2>
            <div id="conversionInfo">
                <!-- Conversion details will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        async function loadConversionDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const conversionId = urlParams.get('id');
            
            if (!conversionId) {
                window.location.href = '/static/account.html';
                return;
            }

            try {
                const response = await fetch(`/api/conversions/${conversionId}`, {
                    credentials: 'include',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                
                if (response.status === 401) {
                    window.location.href = '/static/login.html';
                    return;
                }
                
                if (!response.ok) {
                    throw new Error('Failed to load conversion details');
                }

                const conversion = await response.json();
                // Handle UTC dates properly
                const now = new Date();
                const expiration = conversion.expiration_date ? new Date(conversion.expiration_date) : null;
                const isExpired = expiration ? expiration < now : false;
                const timeRemaining = expiration ? formatTimeLeft(expiration) : '';
                
                document.getElementById('conversionInfo').innerHTML = `
                    <div class="detail-row">
                        <div class="detail-label">Title</div>
                        <div class="detail-value">${conversion.title}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Author</div>
                        <div class="detail-value">${conversion.author}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Voice</div>
                        <div class="detail-value">${conversion.voice ? conversion.voice : 'Unknown'}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Status</div>
                        <div class="detail-value">
                            <span class="status-badge status-${conversion.status.toLowerCase()}">${conversion.status}</span>
                        </div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Progress</div>
                        <div class="detail-value">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${conversion.progress * 100}%"></div>
                            </div>
                            ${Math.round(conversion.progress * 100)}%
                        </div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Created</div>
                        <div class="detail-value">${new Date(conversion.created_at).toLocaleString()}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Expiration</div>
                        <div class="detail-value ${isExpired ? 'expired' : ''}">
                            ${expiration ? 
                                `${expiration.toLocaleString()}
                                <div class="expiration-time">${timeRemaining}</div>` : 
                                'No expiration set'}
                        </div>
                    </div>
                    ${conversion.status === 'completed' && !isExpired ? 
                        `<a href="/download/${conversion.id}" class="button" download>Download Audiobook</a>` : 
                        ''}
                `;

                // Set up periodic updates for time remaining
                if (expiration && !isExpired) {
                    const updateTimeRemaining = () => {
                        const expirationElement = document.querySelector('.expiration-time');
                        if (expirationElement) {
                            const newTimeRemaining = formatTimeLeft(expiration);
                            if (newTimeRemaining === '(Expired)') {
                                expirationElement.parentElement.classList.add('expired');
                                const downloadButton = document.querySelector('.button');
                                if (downloadButton) {
                                    downloadButton.style.display = 'none';
                                }
                                clearInterval(updateInterval);
                            }
                            expirationElement.textContent = newTimeRemaining;
                        }
                    };
                    const updateInterval = setInterval(updateTimeRemaining, 10000);
                }

                if (conversion.status !== 'completed' && conversion.status !== 'failed') {
                    setTimeout(loadConversionDetails, 5000);
                }
            } catch (error) {
                document.getElementById('conversionInfo').innerHTML = `
                    <div style="color: #ff6b6b; text-align: center; padding: 2rem;">
                        Error loading conversion details. Please try again later.
                    </div>
                `;
                setTimeout(loadConversionDetails, 5000);
            }
        }

        function formatTimeLeft(expirationDate) {
            if (!expirationDate) return '';
            
            const now = new Date();
            const expiration = new Date(expirationDate);
            const diffTime = expiration.getTime() - now.getTime();
            
            if (diffTime <= 0) {
                return '(Expired)';
            }
            
            const days = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diffTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diffTime % (1000 * 60 * 60)) / (1000 * 60));
            
            if (days === 0) {
                if (hours === 0) {
                    return `(${minutes} minutes remaining)`;
                }
                return `(${hours} hours, ${minutes} minutes remaining)`;
            }
            
            return `(${days} days, ${hours} hours remaining)`;
        }

        function updateExpirationTime() {
            const expirationElement = document.querySelector('.expiration-time');
            if (expirationElement) {
                const expirationDate = expirationElement.getAttribute('data-expiration');
                expirationElement.textContent = formatTimeLeft(expirationDate);
                if (expirationDate && new Date(expirationDate).getTime() <= new Date().getTime()) {
                    expirationElement.parentElement.classList.add('expired');
                    const downloadButton = document.querySelector('.button');
                    if (downloadButton) {
                        downloadButton.style.display = 'none';
                    }
                }
            }
        }

        // Load conversion details when the page loads
        loadConversionDetails();
    </script>
    <script src="/static/js/feedback.js"></script>
</body>
</html>
