<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion Progress</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            padding-top: 80px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            margin-top: 2rem;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress {
            width: 0%;
            height: 100%;
            background-color: #ff6b6b;
            transition: width 0.3s ease;
        }

        .status {
            text-align: center;
            margin-bottom: 1rem;
        }

        button {
            background-color: #ff6b6b;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #ff5252;
        }

        .error {
            color: #ff6b6b;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-button {
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .nav-button.active {
            background: #ff6b6b;
        }

        .nav-button.active:hover {
            background: #ff5252;
        }
    </style>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/demo-player.js"></script>
    <script src="/static/js/conversion.js"></script>
</head>
<body>
    <nav>
        <a href="/" class="logo">Audiobook Creator</a>
        <div class="nav-buttons">
        </div>
    </nav>

    <div class="container">
        <div class="conversion-details">
            <h1 id="title">Loading...</h1>
            <p id="author"></p>
            <div id="status" class="status">Loading...</div>
            <div id="progress-container" style="display: none;">
                <div class="progress-bar">
                    <div id="progress" class="progress"></div>
                </div>
                <p id="progress-text">0%</p>
            </div>
            <div id="error-message" class="error" style="display: none;"></div>
            <div id="download-section" style="display: none;">
                <button onclick="downloadAudiobook()" class="button">Download Audiobook</button>
            </div>
        </div>

        <div id="demo-section" class="demo-section" style="display: none;">
            <h2>Preview</h2>
            <div class="demo-player">
                <div class="demo-controls">
                    <button id="playButton" class="play-button">▶</button>
                    <div class="demo-progress">
                        <div id="demoProgress" class="progress-bar">
                            <div id="demoProgressFill" class="progress"></div>
                        </div>
                        <div class="time">
                            <span id="currentTime">0:00</span>
                            <span>/</span>
                            <span id="duration">0:00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="message" class="message"></div>
</body>
</html>
