<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion Progress</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            padding-top: 80px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            margin-top: 2rem;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress {
            width: 0%;
            height: 100%;
            background-color: #ff6b6b;
            transition: width 0.3s ease;
        }

        .status {
            text-align: center;
            margin-bottom: 1rem;
        }

        button {
            background-color: #ff6b6b;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #ff5252;
        }

        .error {
            color: #ff6b6b;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-button {
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .nav-button.active {
            background: #ff6b6b;
        }

        .nav-button.active:hover {
            background: #ff5252;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">Audiobook Creator</a>
        <div class="nav-buttons">
        </div>
    </nav>
    <div class="container">
        <h1>Conversion Progress</h1>
        <div class="progress-bar">
            <div class="progress" id="progressBar"></div>
        </div>
        <div class="status" id="status">Preparing conversion...</div>
        <button id="downloadBtn" style="display: none">Download Audiobook</button>
        <div class="error" id="error"></div>
    </div>

    <script>
        const API_URL = '';
        const urlParams = new URLSearchParams(window.location.search);
        const conversionId = urlParams.get('id');
        if (!conversionId) {
            window.location.href = '/static/create_conversion.html';
        }
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');
        const errorText = document.getElementById('error');
        let ws;

        function startWebSocketConnection(conversionId) {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/${conversionId}`;
            
            ws = new WebSocket(wsUrl);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                updateConversionUI(data);
                
                if (data.status === 'completed' || data.status === 'failed') {
                    ws.close();
                }
            };

            ws.onerror = () => {
                errorText.textContent = 'WebSocket connection error';
            };

            ws.onclose = () => {
                console.log('WebSocket connection closed');
            };
        }

        async function fetchConversionState() {
            try {
                const response = await fetch(`/api/conversions/${conversionId}`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                // Update UI with current state
                updateConversionUI(data);
                
                // If conversion is still processing, start WebSocket connection
                if (data.status === 'processing') {
                    startWebSocketConnection(conversionId);
                }
            } catch (error) {
                errorText.textContent = 'Error fetching conversion state';
            }
        }

        function updateConversionUI(data) {
            progressBar.style.width = `${data.progress * 100}%`;
            statusText.textContent = `Status: ${data.status} (${Math.round(data.progress * 100)}%)`;

            if (data.status === 'completed') {
                downloadBtn.style.display = 'block';
                downloadBtn.onclick = () => {
                    window.location.href = `${API_URL}/download/${conversionId}`;
                };
            } else if (data.status === 'failed') {
                errorText.textContent = data.error || 'Conversion failed';
            }
        }

        async function updateNavigation() {
            try {
                const response = await fetch('/api/account', {
                    credentials: 'include'
                });
                
                const isAuthenticated = response.ok;
                const navButtons = document.querySelector('.nav-buttons');
                
                if (isAuthenticated) {
                    navButtons.innerHTML = `
                        <a href="/static/create_conversion.html" class="nav-button">Create audiobook</a>
                        <a href="/static/pricing.html" class="nav-button">Pricing</a>
                        <a href="/static/account.html" class="nav-button">Account</a>
                        <a href="#" class="nav-button" onclick="logout()">Logout</a>
                    `;
                } else {
                    window.location.href = '/static/index.html';
                }
                
                // Set active class for current page
                const currentPath = window.location.pathname;
                const currentButton = navButtons.querySelector(`[href="${currentPath}"]`);
                if (currentButton) {
                    currentButton.classList.add('active');
                }
            } catch (error) {
                console.error('Error checking authentication:', error);
                window.location.href = '/static/index.html';
            }
        }

        // Initialize conversion state
        document.addEventListener('DOMContentLoaded', () => {
            updateNavigation();
            fetchConversionState();
        });

        async function logout() {
            try {
                await fetch('/auth/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
                window.location.reload();
            } catch (error) {
                console.error('Error logging out:', error);
                window.location.reload();
            }
        }
    </script>
</body>
</html>
