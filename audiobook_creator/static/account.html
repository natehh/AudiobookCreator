<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CW8DM4RPK6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-CW8DM4RPK6');
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - Audiobook Creator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            padding-top: 80px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-button {
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .nav-button.active {
            background: #ff6b6b;
        }

        .nav-button.active:hover {
            background: #ff5252;
        }

        .account-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #ccc;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            box-sizing: border-box;
            margin-bottom: 0.5rem;
        }

        .button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 24px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .button:hover {
            background: #ff5252;
        }

        .button.danger {
            background: #dc3545;
        }

        .button.danger:hover {
            background: #c82333;
        }

        .conversions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .conversion-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            transition: transform 0.2s, background-color 0.2s;
            cursor: pointer;
        }

        .conversion-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
        }

        .conversion-status {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 12px;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .expiration-time {
            color: #999;
            font-size: 0.9rem;
            margin-top: 0.25rem;
            font-style: italic;
        }

        .expired {
            color: #ff0000;
            font-weight: bold;
        }

        .status-completed {
            background: #28a745;
        }

        .status-processing {
            background: #ffc107;
            color: #000;
        }

        .status-failed {
            background: #dc3545;
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem;
            border-radius: 8px;
            color: white;
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
            display: none;
        }

        .message.success {
            background-color: #4CAF50;
        }

        .message.error {
            background-color: #f44336;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .payment-method {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .payment-method-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .card-icon {
            font-size: 1.5rem;
        }

        .card-details {
            font-size: 0.9rem;
        }

        .card-details .card-number {
            color: #ccc;
        }

        .card-details .expiry {
            font-size: 0.8rem;
            color: #999;
        }

        .remove-card {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0.5rem;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .remove-card:hover {
            background: rgba(255, 107, 107, 0.1);
        }

        .no-payment-methods {
            text-align: center;
            color: #999;
            padding: 2rem;
            font-style: italic;
        }

        .conversion-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .conversion-info {
            flex-grow: 1;
        }

        .conversion-title {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .conversion-meta {
            color: #ccc;
            font-size: 0.9rem;
        }
    </style>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/account.js"></script>
</head>
<body>
    <nav>
        <a href="/" class="logo">Audiobook Creator</a>
        <div class="nav-buttons">
        </div>
    </nav>

    <div class="container">
        <div class="account-section">
            <h2 class="section-title">Account Information</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-input" readonly>
            </div>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="name" class="form-input">
            </div>
            <button onclick="updateAccount()" class="button">Save Changes</button>
        </div>

        <div class="account-section">
            <h2 class="section-title">Billing Information</h2>
            <div id="payment-methods">
                <!-- Payment methods will be loaded here -->
            </div>
            <div class="button-group">
                <button onclick="window.location.href='/static/payment.html'" class="button">Add Payment Method</button>
                <button onclick="manageBilling()" class="button">View Billing History</button>
            </div>
        </div>

        <div class="account-section">
            <h2 class="section-title">Your Conversions</h2>
            <div class="conversions-grid" id="conversionsGrid">
            </div>
        </div>

        <div class="account-section">
            <h2 class="section-title">Delete Account</h2>
            <p style="color: #ff6b6b;">Warning: This action cannot be undone.</p>
            <button onclick="confirmDeleteAccount()" class="button danger">Delete Account</button>
        </div>
    </div>

    <div id="message" class="message"></div>
    <script src="/static/js/feedback.js"></script>
</body>
</html>
