<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        .nav-button {
            padding: 0.5rem 1rem;
            text-decoration: none;
            color: white;
        }

        .primary-button {
            background-color: #ff6b6b;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">Audiobook Creator</a>
        <div class="nav-buttons">
            <a href="/pricing" class="nav-button">Pricing</a>
            <a href="/login" class="nav-button primary-button">Login</a>
        </div>
    </nav>
    <div class="container">
        <h1>Pricing</h1>
    </div>
</body>
</html>
