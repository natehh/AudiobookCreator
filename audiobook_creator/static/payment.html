<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CW8DM4RPK6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-CW8DM4RPK6');
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="stripe-key" content="{{ STRIPE_PUBLISHABLE_KEY }}">
    <meta name="user-email" content="{{ user_email }}">
    <title>Payment Settings - Audiobook Creator</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            padding-top: 80px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-button {
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .nav-button.active {
            background: #ff6b6b;
        }

        .nav-button.active:hover {
            background: #ff5252;
        }

        .payment-form {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
            max-width: 600px;
            margin: 40px auto;
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
        }
        
        #card-element {
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            margin: 20px 0;
        }
        
        .button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 24px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            margin-top: 20px;
        }
        
        .button:hover {
            background: #ff5252;
        }
        
        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .error {
            color: #ff6b6b;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem;
            border-radius: 8px;
            color: white;
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
            display: none;
        }

        .message.success {
            background-color: #4CAF50;
        }

        .message.error {
            background-color: #f44336;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">Audiobook Creator</a>
        <div class="nav-buttons">
        </div>
    </nav>

    <div class="container">
        <div class="payment-form">
            <h2 class="section-title">Add Payment Method</h2>
            <p style="margin-bottom: 20px; color: #ccc;">Add a new credit or debit card to your account.</p>
            <form id="payment-form">
                <div id="card-element">
                    <!-- Stripe Elements will create form elements here -->
                </div>
                <div id="card-errors" class="error" role="alert"></div>
                
                <button type="button" class="button" onclick="saveCard()">
                    Save Payment Method
                </button>
            </form>
        </div>
    </div>
    
    <div id="message" class="message"></div>

    <script>
        // Initialize Stripe by getting the key from the server
        let stripe;
        let card;

        async function initializeStripe() {
            try {
                const response = await fetch('/api/stripe-key');
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to get Stripe key');
                }
                const data = await response.json();
                if (!data.publishableKey) {
                    throw new Error('No publishable key returned from server');
                }
                
                stripe = Stripe(data.publishableKey);
                
                const elements = stripe.elements();
                
                // Create card Element and mount it
                card = elements.create('card', {
                    style: {
                        base: {
                            fontSize: '16px',
                            color: '#424770',
                            '::placeholder': {
                                color: '#aab7c4',
                            },
                            iconColor: '#666',
                        },
                        invalid: {
                            color: '#9e2146',
                            iconColor: '#9e2146'
                        }
                    }
                });
                card.mount('#card-element');

                // Handle validation errors
                card.addEventListener('change', function(event) {
                    const displayError = document.getElementById('card-errors');
                    if (event.error) {
                        displayError.textContent = event.error.message;
                    } else {
                        displayError.textContent = '';
                    }
                });
            } catch (error) {
                console.error('Error initializing Stripe:', error);
                showMessage('Error initializing payment form: ' + error.message, 'error');
            }
        }

        // Handle form submission
        async function saveCard() {
            if (!stripe || !card) {
                showMessage('Payment form not properly initialized', 'error');
                return;
            }

            try {
                const result = await stripe.createPaymentMethod({
                    type: 'card',
                    card: card,
                });

                if (result.error) {
                    const errorElement = document.getElementById('card-errors');
                    errorElement.textContent = result.error.message;
                    showMessage(result.error.message, 'error');
                    return;
                }

                // Send payment method ID to server
                const response = await fetch('/api/payment-methods/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        payment_method_id: result.paymentMethod.id
                    }),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Failed to save payment method');
                }

                showMessage('Payment method added successfully', 'success');
                setTimeout(() => {
                    window.location.href = '/account';
                }, 1500);
            } catch (error) {
                showMessage('Error saving payment method: ' + error.message, 'error');
                console.error('Error:', error);
            }
        }

        // Initialize navigation
        async function updateNavigation() {
            try {
                const response = await fetch('/auth/status', {
                    credentials: 'include'
                });
                
                const status = response.ok ? await response.json() : { authenticated: false };
                const isAuthenticated = Boolean(status.authenticated);
                const navButtons = document.querySelector('.nav-buttons');
                
                if (isAuthenticated) {
                    navButtons.innerHTML = `
                    <a href="/create" class="nav-button">Create audiobook</a>
                    <a href="/pricing" class="nav-button">Pricing</a>
                    <a href="/account" class="nav-button">Account</a>
                        <a href="#" class="nav-button" onclick="logout()">Logout</a>
                    `;
                } else {
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('Error checking authentication:', error);
                window.location.href = '/';
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        async function logout() {
            try {
                await fetch('/auth/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
                window.location.reload();
            } catch (error) {
                showMessage('Error logging out', 'error');
                window.location.reload();
            }
        }

        // Load navigation and initialize Stripe when page loads
        document.addEventListener('DOMContentLoaded', () => {
            updateNavigation();
            initializeStripe();
        });
    </script>
    <script src="/static/js/feedback.js"></script>
</body>
</html>
